name: Nicominecith Musik - Debug APK (kein Signing nötig)

# Manuell startbar über den "Actions"-Tab auf GitHub ("Run workflow"),
# oder automatisch bei jedem Push auf main.
on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto
        run: |
          rm -rf metroproto
          git clone --depth 1 https://github.com/MetrolistGroup/metroproto metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/workflow-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Nicominecith Musik Debug,O=Nicominecith,C=DE"

      - name: Build Debug APK (FOSS flavor)
        run: ./gradlew --console=plain assembleFossDebug --warning-mode summary -x lint
        env:
          METROLIST_DEBUG_KEYSTORE_PATH: workflow-debug.keystore

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: nicominecith-musik-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
